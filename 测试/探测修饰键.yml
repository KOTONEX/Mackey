# 语义探针：判定 xremap 的 modmap（修饰键位置交换）与 keymap 触发条件的先后关系。
# 每条规则都用 launch 动作做副作用，便于脚本断言；不会向会话注入任何按键。
modmap:
  - name: pc-swap-probe
    remap:
      Alt_L: Super_L
      Super_L: Alt_L

keymap:
  - name: trigger-with-physical-name
    remap:
      Alt-c: { launch: ["/usr/bin/touch", "/tmp/mackey-probe/physical-alt-c"] }
      Super-h: { launch: ["/usr/bin/touch", "/tmp/mackey-probe/physical-super-h"] }
  - name: trigger-with-logical-name
    remap:
      Super-c: { launch: ["/usr/bin/touch", "/tmp/mackey-probe/logical-super-c"] }
      Alt-h: { launch: ["/usr/bin/touch", "/tmp/mackey-probe/logical-alt-h"] }
