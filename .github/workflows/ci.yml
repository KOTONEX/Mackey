# SPDX-License-Identifier: AGPL-3.0-or-later
name: 持续集成
on:
  push:
    branches: [主线]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: 完整检查 ${{ matrix.arch }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-26.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 准备 HOME 内的源码与开发依赖
        run: |
          cp -a "$GITHUB_WORKSPACE" "$HOME/mackey-ci"
          sudo apt-get update
          sudo apt-get install -y jq shellcheck gjs dbus-x11 build-essential cmake
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: 准备最新稳定原生 TypeScript
        uses: ./.github/actions/原生编译器
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 统一离线检查
        run: |
          cd "$HOME/mackey-ci"
          cargo 检查
      - name: 验证发行打包
        run: |
          cd "$HOME/mackey-ci"
          cargo 打包
      - uses: actions/upload-artifact@v7
        with:
          name: mackey-ci-${{ matrix.arch }}
          path: ~/mackey-ci/builddir/发行/*.tar.gz
          if-no-files-found: error
          retention-days: 7
