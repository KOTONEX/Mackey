# SPDX-License-Identifier: AGPL-3.0-or-later
name: 持续集成
on:
  push:
    branches: [主线]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: 完整检查 ${{ matrix.arch }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-26.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 编译原生准备工具
        run: rustc --edition=2024 .github/流水线.rs -o "$HOME/mackey-流水线"
      - name: 准备 HOME 内的源码与稳定工具链
        run: '"$HOME/mackey-流水线" 准备 构建'
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 统一离线检查
        working-directory: ${{ env.MACKEY_WORKSPACE }}
        run: cargo 检查
      - name: 验证发行打包
        working-directory: ${{ env.MACKEY_WORKSPACE }}
        run: cargo 打包
      - uses: actions/upload-artifact@v7
        with:
          name: mackey-ci-${{ matrix.arch }}
          path: ~/mackey-ci/builddir/发行/*.tar.gz
          if-no-files-found: error
          retention-days: 7
