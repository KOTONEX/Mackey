# SPDX-License-Identifier: AGPL-3.0-or-later
name: 发布
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  binary:
    name: 检查与打包 ${{ matrix.arch }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-26.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 准备 HOME 内的源码与开发依赖
        run: |
          cp -a "$GITHUB_WORKSPACE" "$HOME/mackey-ci"
          sudo apt-get update
          sudo apt-get install -y jq shellcheck gjs dbus-x11 build-essential cmake
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: 准备最新稳定原生 TypeScript
        uses: ./.github/actions/原生编译器
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 校验发布标签与 Cargo 版本
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd "$HOME/mackey-ci"
          cargo_ver="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mackey") | .version')"
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then test "$RELEASE_TAG" = "v$cargo_ver"; fi
      - name: 统一检查与原生发行包
        run: |
          cd "$HOME/mackey-ci"
          cargo 检查
          cargo 打包
      - uses: actions/upload-artifact@v7
        with:
          name: mackey-linux-${{ matrix.arch }}
          path: ~/mackey-ci/builddir/发行/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'x86_64'
        with:
          name: mackey-release-notes
          path: ~/mackey-ci/builddir/发布说明.md
          if-no-files-found: error
  release:
    name: 校验并发布附件
    needs: binary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 准备发行目录
        run: |
          cp -a "$GITHUB_WORKSPACE" "$HOME/mackey-release"
          mkdir -p "$HOME/mackey-release/builddir/发行"
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: 准备最新稳定原生 TypeScript
        uses: ./.github/actions/原生编译器
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: mackey-linux-*
          path: ~/mackey-release/builddir/发行
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: mackey-release-notes
          path: ~/mackey-release/builddir
      - name: 打包源码与 GNOME 扩展、生成校验和
        run: |
          cd "$HOME/mackey-release"
          cargo 发布附件
      - name: 按主分支归属发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd "$HOME/mackey-release"
          git show-ref --verify --quiet refs/remotes/origin/main
          prerelease=true
          latest=false
          if git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            prerelease=false
            latest=true
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]]; then
              echo '该版本已公开，拒绝覆盖附件；修正应发布新版本。' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" builddir/发行/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file builddir/发布说明.md
          else
            gh release create "$RELEASE_TAG" builddir/发行/* --verify-tag --draft --prerelease --title "Mackey $RELEASE_TAG" --notes-file builddir/发布说明.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease" --latest="$latest"
      - uses: actions/upload-artifact@v7
        with:
          name: mackey-release
          path: ~/mackey-release/builddir/发行/*
          if-no-files-found: error
