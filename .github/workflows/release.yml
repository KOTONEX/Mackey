# SPDX-License-Identifier: AGPL-3.0-or-later
name: 发布
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  binary:
    name: 检查与打包 ${{ matrix.arch }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-26.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 编译原生准备工具
        run: rustc --edition=2024 .github/流水线.rs -o .github/流水线
      - name: 准备项目目录与稳定工具链
        run: .github/流水线 准备 构建
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 校验发布标签与 Cargo 版本
        working-directory: ${{ env.MACKEY_WORKSPACE }}
        run: cargo 运行 流水线 校验标签
      - name: 统一检查
        working-directory: ${{ env.MACKEY_WORKSPACE }}
        run: cargo 检查
      - name: 原生发行包
        working-directory: ${{ env.MACKEY_WORKSPACE }}
        run: cargo 打包
      - uses: actions/upload-artifact@v7
        with:
          name: mackey-linux-${{ matrix.arch }}
          path: ${{ env.MACKEY_WORKSPACE }}/builddir/发行/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'x86_64'
        with:
          name: mackey-release-notes
          path: ${{ env.MACKEY_WORKSPACE }}/builddir/发布说明.md
          if-no-files-found: error
  release:
    name: 校验并发布附件
    needs: binary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 编译原生准备工具
        run: rustc --edition=2024 .github/流水线.rs -o .github/流水线
      - name: 准备发行目录与稳定工具链
        run: .github/流水线 准备 发行
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: mackey-linux-*
          path: ${{ env.MACKEY_WORKSPACE }}/builddir/发行
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: mackey-release-notes
          path: ${{ env.MACKEY_WORKSPACE }}/builddir
      - name: 打包源码与 GNOME 扩展、生成校验和
        working-directory: ${{ env.MACKEY_WORKSPACE }}
        run: cargo 发布附件
      - name: 按主分支归属发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ env.MACKEY_WORKSPACE }}
        run: cargo 运行 流水线 公开发行
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: mackey-release
          path: ${{ env.MACKEY_WORKSPACE }}/builddir/发行/*
          if-no-files-found: error
