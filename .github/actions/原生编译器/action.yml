name: 最新稳定原生 TypeScript
description: 从微软官方 GitHub 正式发行获取并校验原生编译器，无需 Node/npm
runs:
  using: composite
  steps:
    - name: 获取并校验官方原生编译器
      shell: bash
      run: |
        set -euo pipefail
        case "$RUNNER_ARCH" in
          X64) arch=x64 ;;
          ARM64) arch=arm64 ;;
          *) echo "不支持的 runner 架构：$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        asset="typescript-linux-$arch.tgz"
        release="$(gh api repos/microsoft/TypeScript/releases/latest)"
        tag="$(jq -er 'select(.prerelease == false and .draft == false) | .tag_name' <<< "$release")"
        digest="$(jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .digest | select(startswith("sha256:")) | ltrimstr("sha256:")' <<< "$release")"
        mkdir -p "$HOME/.local/share/mackey-ci-tools"
        compiler_dir="$(mktemp -d "$HOME/.local/share/mackey-ci-tools/tsc.XXXXXX")"
        gh release download "$tag" --repo microsoft/TypeScript --pattern "$asset" --dir "$compiler_dir"
        printf '%s  %s\n' "$digest" "$compiler_dir/$asset" | sha256sum --check --status
        tar -xzf "$compiler_dir/$asset" -C "$compiler_dir"
        tsc_dir="$compiler_dir/package/lib"
        magic="$(head -c 4 "$tsc_dir/tsc" | od -An -tx1 | tr -d ' \n')"
        test "$magic" = 7f454c46
        echo "TypeScript 官方稳定发行：$tag；架构：$arch"
        "$tsc_dir/tsc" --version
        rustc --version
        echo "$tsc_dir" >> "$GITHUB_PATH"
